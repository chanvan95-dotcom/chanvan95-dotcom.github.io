<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f5f0">
  <meta name="description" content="Undangan pernikahan digital.">
  <title>Undangan Pernikahan</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; background: #f8f5f0; color: #332b25; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; min-height: 100%; margin: 0; overflow: hidden; }
    body { background: #f8f5f0; }
    #invitationFrame { display: block; width: 100%; height: 100vh; height: 100dvh; border: 0; background: #f8f5f0; }
    #loading, #configurationError {
      position: fixed; inset: 0; z-index: 2; display: grid; place-items: center;
      padding: 28px; text-align: center; background: #f8f5f0;
    }
    #loading p, #configurationError p { max-width: 520px; line-height: 1.6; }
    #configurationError { display: none; }
    .loading-mark { font-size: 28px; color: #9b795e; margin-bottom: 10px; }
    code { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <div><div class="loading-mark">✿</div><p>Menyiapkan undangan Anda…</p></div>
  </div>
  <div id="configurationError" role="alert">
    <div>
      <div class="loading-mark">✿</div>
      <h1>Undangan belum dikonfigurasi</h1>
      <p>Alamat Google Apps Script Web App belum diisi. Lengkapi variabel <code>GAS_WEB_APP_URL</code> pada file <code>index.html</code> GitHub Pages.</p>
    </div>
  </div>
  <iframe
    id="invitationFrame"
    title="Undangan Pernikahan"
    allow="autoplay; encrypted-media; fullscreen; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin"
    loading="eager">
  </iframe>

  <script>
    // Ganti dengan URL deployment Google Apps Script yang berakhiran /exec.
    // Contoh format: https://script.google.com/macros/s/DEPLOYMENT_ID/exec
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyAJ9UlLcfXbGRWQY-KVE-kFefiOHE8T1bOxXUFXPaD8DVJFT9XM0sR0wJ5vY24NMZS/exec';

    (function bootInvitation() {
      const frame = document.getElementById('invitationFrame');
      const loading = document.getElementById('loading');
      const error = document.getElementById('configurationError');
      const configured = /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec\/?$/.test(GAS_WEB_APP_URL);

      if (!configured) {
        frame.style.display = 'none';
        loading.style.display = 'none';
        error.style.display = 'grid';
        return;
      }

      const target = new URL(GAS_WEB_APP_URL);
      const params = new URLSearchParams(window.location.search);
      const guestToken = params.get('guest');
      if (guestToken) target.searchParams.set('guest', guestToken);
      else target.searchParams.delete('guest');

      frame.addEventListener('load', function () {
        loading.style.display = 'none';
      }, { once: true });

      frame.src = target.toString();
    })();
  </script>
</body>
</html>
